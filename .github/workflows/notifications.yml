name: Deliver Club Notifications
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: club-notification-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deliver pending notifications with bounded retries
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
        run: node scripts/deliver-notifications.cjs
