name: Sync Club Data (backup scheduler)
# Second scheduler in case Supabase pg_cron stops. On a schedule it only syncs
# when no full sync has succeeded for 25 minutes; manual runs always sync.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: club-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync with a stable request ID
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          SYNC_ONLY_IF_STALE_MINUTES: ${{ github.event_name == 'schedule' && '25' || '0' }}
        run: node scripts/scheduled-sync.cjs
